# =====================================================================
# Test profile — H2 in-memory, sem Redis/PostgreSQL real
# Usado por @DataJpaTest e @SpringBootTest nos testes de integração
# =====================================================================

spring.datasource.url=jdbc:h2:mem:aegis_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Aegis: valores mínimos para testes compilarem sem chaves RSA reais
aegis.jwt.access-token-expiration=3600
aegis.jwt.refresh-token-expiration=86400
aegis.jwt.private-key-path=keys/private_key.pem
aegis.jwt.public-key-path=keys/public_key.pem

aegis.audit.chain.enabled=true
aegis.audit.chain.verify-on-startup=false
aegis.audit.chain.max-payload-size-bytes=4096

aegis.shield.enabled=false

aegis.consent.current-version=1.0
aegis.consent.document-url=https://aegisprotocol.example/legal/terms-privacy-v1.0

# enabled=false: sweep agendado não deve rodar durante os testes de contexto Spring
aegis.retention.enabled=false
aegis.retention.chain-retention-days=365
aegis.retention.archive-dir=target/test-audit-archive
aegis.retention.batch-size=500

# enabled=false: checagem de SLA agendada não deve rodar durante os testes de contexto Spring
aegis.incident.enabled=false
aegis.incident.min-severity=HIGH
aegis.incident.acknowledge-sla-hours-critical=4
aegis.incident.notify-sla-hours-critical=24
aegis.incident.acknowledge-sla-hours-high=24
aegis.incident.notify-sla-hours-high=72

# enabled=false: sem Network Sentinel interferindo nos testes de contexto Spring
aegis.network.sentinel-enabled=false
aegis.network.protected-path-patterns[0]=/api/admin/**
aegis.network.block-on-untrusted-source=false
aegis.network.cors-allowed-origins[0]=http://localhost:4200

# spring.mail.host precisa de ALGUM valor pro MailSenderAutoConfiguration
# criar o bean — nenhum teste manda e-mail de verdade (tudo mockado).
spring.mail.host=localhost
spring.mail.port=1025
aegis.notification.enabled=false
aegis.notification.from-address=no-reply@aegisprotocol.example
aegis.notification.compliance-team-email=
