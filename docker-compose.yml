version: '3.8'

services:
  # 1. Banco de Dados Principal (Audit + Policies)
  aegis-db:
    image: postgres:15-alpine
    container_name: aegis-postgres
    environment:
      POSTGRES_DB: aegis_core
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aegis-net

  # 2. Cache e Controle de Sessão (Tokens + Rate Limit)
  aegis-redis:
    image: redis:7-alpine
    container_name: aegis-redis
    ports:
      - "6379:6379"
    networks:
      - aegis-net

  # 3. KMS/Vault real (satélite KMS/Vault) — dev mode: em memória, root token
  # fixo, NUNCA use isto em produção como está (é só pra rodar local/CI).
  # Ative com aegis.jwt.key-source=vault. Antes de subir a app, grave o par
  # inicial em secret/data/aegis/jwt/current (private_key_pem/public_key_pem).
  aegis-vault:
    image: hashicorp/vault:1.15
    container_name: aegis-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: aegis-dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    networks:
      - aegis-net

networks:
  aegis-net:
    driver: bridge

volumes:
  postgres_data: