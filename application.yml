server:
  port: 9090

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    urls:
      - name: default
        url: /v3/api-docs
    disable-swagger-default-url: true

spring:
  application:
    name: AegisProtocol-Core

  datasource:
    url: jdbc:postgresql://localhost:5434/aegis_core
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    # "update" cria/atualiza tabelas automaticamente (Dev).
    # Em Produção, use "validate" ou "none" (com Flyway/Liquibase).
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

# Configurações Customizadas do Aegis
aegis:
  jwt:
    access-token-expiration: 300       # 5 min
    refresh-token-expiration: 86400    # 24h
    private-key-path: "keys/private_key.pem"
    public-key-path: "keys/public_key.pem"
    key-retention-count: 3             # Chaves válidas p/ verificação (atual + anteriores). Cubra >= refresh-token-expiration
    key-source: file                   # "file" (padrão) ou "vault" (satélite KMS/Vault real — ver aegis.vault.* abaixo)

  # S.H.I.E.L.D. — Secure Host Intelligence for Enterprise Lateral Detection
  shield:
    enabled: true
    block-threshold: CRITICAL          # Bloqueia requisição neste nível (NONE/LOW/MEDIUM/HIGH/CRITICAL)
    alert-threshold: HIGH              # Persiste alerta a partir deste nível
    lateral-movement-resource-limit: 10 # Recursos distintos por sessão antes de acionar detecção
    session-window-minutes: 30         # Janela de análise (minutos)
    score-per-extra-ip: 20             # Penalidade por IP extra no mesmo JTI
    score-per-extra-agent: 10          # Penalidade por User-Agent extra no mesmo JTI
    score-lateral-movement: 35         # Penalidade ao detectar movimento lateral
    score-fingerprint-mismatch: 25     # Penalidade por divergência de fingerprint

  # Ômega — Cryptographic Audit Chain
  audit:
    chain:
      enabled: true
      verify-on-startup: false          # true ativará verificação forense na inicialização (lento em prod)
      max-payload-size-bytes: 4096      # Limite de payload JSON por entry

  # KMS/Vault real — só é lido quando aegis.jwt.key-source=vault. O token NÃO
  # deve ficar em texto aqui em produção — use ${AEGIS_VAULT_TOKEN} (variável
  # de ambiente) ou troque por um AppRole. docker-compose sobe um Vault em
  # dev mode (serviço aegis-vault) com root token "aegis-dev-root-token".
  vault:
    address: "http://127.0.0.1:8200"
    token: "${AEGIS_VAULT_TOKEN:aegis-dev-root-token}"
    mount: "secret"
    base-path: "aegis/jwt"
    connect-timeout-ms: 3000
    read-timeout-ms: 3000

  # Consent Ledger — versão vigente dos termos/política de privacidade.
  # Bump aqui quando o texto legal mudar: clientes com consentVersion antigo
  # passam a ser rejeitados em /auth/register até mandarem a versão nova.
  consent:
    current-version: "1.0"
    document-url: "https://aegisprotocol.example/legal/terms-privacy-v1.0"

  # Retention Engine — arquivamento (nunca DELETE) de entries do Ômega fora
  # da janela de retenção. Ver RetentionProperties para o porquê.
  retention:
    enabled: true
    chain-retention-days: 365
    archive-dir: "audit-archive"
    batch-size: 500
    cron: "0 0 2 * * *"          # 02:00 todo dia

  # Incident Response Orchestrator — ShieldThreatEvent >= minSeverity vira
  # incidente formal com SLA. Ajuste os prazos pra sua política interna.
  incident:
    enabled: true
    min-severity: HIGH
    acknowledge-sla-hours-critical: 4
    notify-sla-hours-critical: 24
    acknowledge-sla-hours-high: 24
    notify-sla-hours-high: 72
    sla-check-cron: "0 */15 * * * *"   # a cada 15 min

  # Network Sentinel — perímetro de rede pros caminhos protegidos. Zonas
  # cadastradas via POST /api/admin/network/zones (fail-open se nenhuma existir).
  network:
    sentinel-enabled: true
    protected-path-patterns:
      - "/api/admin/**"
    block-on-untrusted-source: false   # alerta primeiro; ligue quando tiver confiança nas zonas cadastradas
    cors-allowed-origins:
      - "http://localhost:4200"
      - "http://localhost:3000"